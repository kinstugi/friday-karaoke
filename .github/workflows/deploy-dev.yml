# Deploy the `dev` branch to Cloud Run automatically.
#
# GitHub Actions authenticates to GCP using the `github-actions-deployer`
# service-account key, stored ONLY as the encrypted `GCP_SA_KEY` GitHub Actions
# secret (never in the repo or its history). We initially tried keyless Workload
# Identity Federation, but its impersonated-credentials path kept denying
# `iam.serviceAccounts.getAccessToken` despite correct-looking bindings, so we
# pivoted to a service-account key — same secret-not-in-repo protection.
#
# The Neon DB URL and YouTube API key are GitHub Actions secrets too. A future
# `master` branch can get its own workflow targeting a different server.

name: Deploy (dev -> Cloud Run)

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker login to Artifact Registry
        run: |
          gcloud auth print-access-token | \
            docker login -u oauth2accesstoken --password-stdin \
            https://${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build image
        run: docker build -t ${{ vars.GCP_ARTIFACT_REGISTRY }}/karaoke-app:latest .

      - name: Push image
        run: docker push ${{ vars.GCP_ARTIFACT_REGISTRY }}/karaoke-app:latest

      - name: Deploy to Cloud Run
        env:
          KARAOKE_DATABASE_URL: ${{ secrets.KARAOKE_DATABASE_URL }}
          KARAOKE_YOUTUBE_API_KEY: ${{ secrets.KARAOKE_YOUTUBE_API_KEY }}
        run: |
          gcloud run deploy karaoke-app \
            --image=${{ vars.GCP_ARTIFACT_REGISTRY }}/karaoke-app:latest \
            --region=${{ vars.GCP_REGION }} \
            --allow-unauthenticated --min-instances=0 --memory=512Mi --cpu=1 \
            --set-env-vars="KARAOKE_DATABASE_URL=$KARAOKE_DATABASE_URL,KARAOKE_RATE_LIMITS_ENABLED=true,KARAOKE_PUBLIC_BASE_URL=https://karaoke-app-ywmqmgfyoa-uc.a.run.app,KARAOKE_YOUTUBE_API_KEY=$KARAOKE_YOUTUBE_API_KEY"
